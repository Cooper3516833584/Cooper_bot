services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: always

    # 账号等敏感信息放在 secrets.env
    env_file:
      - ./config/private/secrets.env

    ports:
      - "13001:3001"  # WebSocket
      - "16099:6099"  # WebUI
      - "13010:3010"  # 你在 WebUI 里配置的 HTTP Server 端口（如果你就是用 3010）
      - "13000:3000"  # 官方默认 HTTP 端口（留着不冲突，防止你哪天改回默认）

    volumes:
      # 资料库挂载（让 upload_* 能直接读取 storage/documents 中的文件）
      - "./storage/documents:/bot_data"
      # 你的“上传目录”挂载（给 upload_group_file / upload_private_file 用）
      - "./runtime/staging/group:/data/upload_group_file"
      - "./runtime/staging/private:/data/upload_private_file"

      # 强烈建议：持久化 QQ 数据和 NapCat 配置，否则你一 recreate 容器配置就丢
      - "./runtime/napcat/qq:/app/.config/QQ"
      - "./runtime/napcat/config:/app/napcat/config"
